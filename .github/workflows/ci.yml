---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Development CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: echo "node_version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
        id: cat-nvmrc

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.cat-nvmrc.outputs.node_version}}

      - run: npm run build-dist

      - name: Check if build left artifacts
        run: git diff --exit-code

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5'

      - run: npm run test

  action:
    name: Action CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          # An Erlang/OTP version ELP ships builds for (otp-<major>.<minor> assets)
          otp-version: '28.5'

      - name: Use erlef/setup-elp
        id: setup-elp
        uses: ./
        with:
          # Pinned, so that a new ELP release (e.g. one dropping this Erlang/OTP version) cannot
          # break CI on its own
          elp-version: '2026-11-19'

      - run: elp version

      # A release asset stands in for an unreleased build; a version other than the ones above shows
      # that the tarball replaced them
      - name: Use erlef/setup-elp with an ELP tarball
        if: runner.os == 'Linux'
        uses: ./
        with:
          elp-tarball: "https://github.com/WhatsApp/erlang-language-platform/releases/download/\
            2026-11-16/elp-linux-x86_64-unknown-linux-gnu-otp-28.5.tar.gz"

      - if: runner.os == 'Linux'
        run: elp version | grep -F 'build-2026-11-16'
