---
name: setup-elp
author: Erlang Ecosystem Foundation
description: >
  An example GitHub Actions Node.js template.
  Takes an input, echoes it, outputs it.
inputs:
  elp-version:
    description: The ELP version to use (a release tag, e.g. 2026-10-05, or latest)
    required: false
    default: latest
runs:
  using: node20
  main: dist/index.js
branding:
  color: blue
  icon: code
