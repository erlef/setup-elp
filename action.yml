---
name: setup-elp
author: Erlang Ecosystem Foundation
description: >
  Install ELP (Erlang Language Platform) to lint and type check Erlang code with eqWAlizer.
inputs:
  elp-version:
    description: The ELP version to use (a release tag, e.g. 2026-10-05, or latest)
    required: false
    default: latest
runs:
  using: node24
  main: dist/index.js
branding:
  color: blue
  icon: code
